name: ROMS STORE - Publicacao OTA por versao
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roms-store-official-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar ferramentas de build
        run: sudo apt-get update -q && sudo apt-get install -y luajit lua5.3 zip unzip
      - name: Testar e construir os tres ZIPs
        env:
          CI: 'true'
        run: bash tools/build.sh
      - name: Validar versao e impedir downgrade
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          version=Path('VERSION').read_text().strip()
          feed=json.loads(Path('build/update.json').read_text())
          assert feed['app']=='r36s-roms-store' and feed['version']==version
          repo=os.environ['GITHUB_REPOSITORY']
          current=json.loads(subprocess.check_output([
              'gh','api',f'repos/{repo}/contents/update.json',
              '-H','Accept: application/vnd.github.raw+json'], text=True))
          parse=lambda s: tuple(map(int,s.split('-')[0].split('.')))
          assert parse(version)>parse(current['version']),'Downgrade/duplicated version'
          tag='roms-v'+version
          assert subprocess.run(['gh','release','view',tag,'--repo',repo],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode!=0,'Release already exists'
          for ext in ['TESTE','UPDATE','FONTE']:
              assert (Path('build')/f'R36S_ROMS_STORE_v{version}_{ext}.zip').is_file()
          PY
      - name: Criar tag e Release apos testes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          VER=$(tr -d '\r\n' < VERSION)
          TAG="roms-v$VER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag -a "$TAG" -m "R36S ROMS STORE $VER"
            git push origin "refs/tags/$TAG"
          fi
          gh release create "$TAG" \
            "build/R36S_ROMS_STORE_v${VER}_TESTE.zip" \
            "build/R36S_ROMS_STORE_v${VER}_UPDATE.zip" \
            "build/R36S_ROMS_STORE_v${VER}_FONTE.zip" \
            --repo "$GITHUB_REPOSITORY" --title "R36S ROMS STORE $VER" \
            --notes-file CHANGELOG.md --prerelease --latest=false
      - name: Baixar Release publica e verificar os checksums SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          VER=$(tr -d '\r\n' < VERSION)
          mkdir -p verify
          gh release download "roms-v$VER" --repo "$GITHUB_REPOSITORY" --dir verify
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          info=json.loads(Path('build/update.json').read_text())
          for suffix,key in [('TESTE','installer_sha256'),('UPDATE','sha256'),('FONTE','source_sha256')]:
              p=Path('verify')/f'R36S_ROMS_STORE_v{info["version"]}_{suffix}.zip'
              assert hashlib.sha256(p.read_bytes()).hexdigest()==info[key],p
          PY
      - name: Ativar novo manifesto somente com Release validada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/update.json" --jq '.sha')
          CONTENT=$(base64 -w0 build/update.json)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/update.json" \
            -f message="release: activate OTA $(cat VERSION)" \
            -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null
          echo "### OTA publicado: $(cat VERSION)" >> "$GITHUB_STEP_SUMMARY"