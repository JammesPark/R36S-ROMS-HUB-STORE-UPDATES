name: Validar codigo R36S ROMS STORE
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'port/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/validate-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT, Lua 5.3 and packaging tools
        run: sudo apt-get update -q && sudo apt-get install -y luajit lua5.3 zip unzip
      - name: Syntax check and offline integration tests
        env:
          CI: 'true'
        run: bash tools/build.sh
