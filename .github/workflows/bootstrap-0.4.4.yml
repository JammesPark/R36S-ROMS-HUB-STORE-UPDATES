name: Importar fonte 0.4.4 e publicar OTA
on:
  push:
    branches: [main]
    paths:
      - 'R36S_ROMS_STORE_v0.4.4-beta_FONTE.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roms-store-bootstrap-044
  cancel-in-progress: false
jobs:
  import-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com historico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar integridade e extrair fonte (sem sobrescrever workflows)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, shutil, stat, zipfile
          name='R36S_ROMS_STORE_v0.4.4-beta_FONTE.zip'
          expected='9ce943842c72d30b9f63289ca3c120aa78774756c196fc2af85e706c43259098'
          path=pathlib.Path(name)
          assert path.is_file(), 'Faça upload do ZIP FONTE na raiz do repositorio'
          h=hashlib.sha256(path.read_bytes()).hexdigest()
          assert h==expected, f'Arquivo incorreto ou alterado (SHA-256 {h})'
          roots=('src/','port/','tests/','tools/','docs/')
          root_files={'VERSION','README.md','CHANGELOG.md','LICENSE','THIRD_PARTY_NOTICES.txt','7-Zip-License.txt'}
          with zipfile.ZipFile(path) as z:
            entries=z.infolist()
            assert len(entries)<400 and len(entries)==len({i.filename for i in entries}), 'ZIP duplicado/muito grande'
            total=0
            for i in entries:
              n=i.filename
              assert not n.startswith('/') and '\\' not in n and not n.endswith('/'), 'Caminho perigoso'
              p=pathlib.PurePosixPath(n)
              assert '..' not in p.parts and all(x not in ('','.','..') for x in p.parts), 'Travessia de diretorios'
              assert not stat.S_ISLNK(i.external_attr >> 16), 'Link simbolico no ZIP'
              assert n in root_files or n.startswith(roots) or n.startswith('.github/workflows/'), f'Arquivo inesperado {n}'
              assert i.file_size < 30*1024*1024
              total+=i.file_size
            assert total<130*1024*1024, 'ZIP descompactado grande demais'
            assert z.read('VERSION').decode().strip()=='0.4.4-beta', 'Versao incorreta'
            for i in entries:
              if i.filename.startswith('.github/workflows/'): continue
              output=pathlib.Path(i.filename)
              output.parent.mkdir(parents=True,exist_ok=True)
              with z.open(i) as src, output.open('wb') as dest: shutil.copyfileobj(src,dest)
          print('Fonte validada e extraida:',len(entries),'arquivos')
          PY
      - name: Instalar LuaJIT e ferramentas
        run: sudo apt-get update -q && sudo apt-get install -y luajit lua5.3 zip unzip
      - name: Testes reais de build e geraçao dos tres ZIPs
        run: bash tools/build.sh
      - name: Validar versao e impedir downgrade
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          version=Path('VERSION').read_text().strip()
          feed=json.loads(Path('build/update.json').read_text())
          assert version=='0.4.4-beta' and feed['version']==version and feed['status']=='published'
          repo=os.environ['GITHUB_REPOSITORY']
          existing=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{repo}/contents/update.json',
               '-H','Accept: application/vnd.github.raw+json'],text=True))
          key=lambda v: tuple(map(int,v.split('-')[0].split('.')))
          assert key(version)>key(existing['version']), 'Versao ja publicada ou antiga'
          PY
          ! git ls-remote --exit-code --tags origin refs/tags/roms-v0.4.4-beta
      - name: Colocar codigo-fonte no main e criar tag oficial
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'build/\n__pycache__/\n*.pyc\n' > .gitignore
          git rm -f R36S_ROMS_STORE_v0.4.4-beta_FONTE.zip
          git add -A -- src port tools tests docs VERSION README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.txt 7-Zip-License.txt .gitignore
          git diff --cached --quiet && { echo 'Nenhuma alteracao de codigo'; exit 1; }
          git commit -m "release: import ROMS STORE source v0.4.4-beta"
          git push origin HEAD:main
          git tag -a roms-v0.4.4-beta -m "R36S ROMS STORE OTA v0.4.4-beta"
          git push origin refs/tags/roms-v0.4.4-beta
      - name: Publicar Release com TESTE UPDATE e FONTE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create roms-v0.4.4-beta \
            build/R36S_ROMS_STORE_v0.4.4-beta_TESTE.zip \
            build/R36S_ROMS_STORE_v0.4.4-beta_UPDATE.zip \
            build/R36S_ROMS_STORE_v0.4.4-beta_FONTE.zip \
            --repo "$GITHUB_REPOSITORY" --title "R36S ROMS STORE 0.4.4-beta" \
            --notes "OTA de transicao; BIOS e Loja de Temas no menu principal." \
            --prerelease --latest=false
      - name: Conferir os tres arquivos publicados por SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p verify
          gh release download roms-v0.4.4-beta --repo "$GITHUB_REPOSITORY" --dir verify
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=json.loads(Path('build/update.json').read_text())
          for kind,key in [('UPDATE','sha256'),('TESTE','installer_sha256'),('FONTE','source_sha256')]:
            p=Path('verify')/f'R36S_ROMS_STORE_v{d["version"]}_{kind}.zip'
            assert hashlib.sha256(p.read_bytes()).hexdigest()==d[key],f'Arquivo publico diverge: {kind}'
            print('Verificado',p.name)
          PY
      - name: Tornar a atualizacao online disponivel somente apos verificacao
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/update.json" --jq .sha)
          CONTENT=$(base64 -w0 build/update.json)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/update.json" \
            -f message="release: activate ROMS STORE OTA 0.4.4-beta" \
            -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null
