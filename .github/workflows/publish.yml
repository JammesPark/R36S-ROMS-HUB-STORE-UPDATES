name: Publicar e verificar atualização OTA
on:
  push:
    branches: [main]
    paths: ['distribution/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-ota
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar pacote OTA e conferir manifesto
        run: python3 prepare.py
      - name: Publicar e verificar os dois ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat distribution/version.txt)
          tag="store-v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" out/*.zip --target "$GITHUB_SHA" --title "R36S ROMS STORE $version" --notes "Instalação inicial: baixe o ZIP sem o sufixo OTA. O console usa o ZIP OTA nas próximas atualizações."
          fi
          mkdir verify
          for file in out/*.zip; do
            name=$(basename "$file")
            curl -fsSL --retry 4 --retry-all-errors "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name" -o "verify/$name"
            cmp "$file" "verify/$name"
          done
      - name: Ativar feed verificado
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          test "$(cat distribution/version.txt)" = "$(jq -r .version out/update.json)"
          mkdir -p ota
          cp out/update.json ota/update.json
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add ota/update.json
          if ! git diff --cached --quiet; then
            git commit -m "Ativar OTA $(cat distribution/version.txt)"
            git push origin HEAD:main
          fi
